# Configuration file for nginx server
# `nginx_server.conf` is the configuration file that is used and that should be
# maintained by the user
# `nginx_server.conf.sample` is the default configuration file which is updated
# automatically
# Version: 1.9.0

server {
    listen 80;

    gzip on;
    gunzip on;
    gzip_types text/plain
               text/css
               text/js
               text/xml
               text/javascript
               application/javascript
               application/json
               application/rss+xml
               image/svg+xml;

    root /app/static/;
    index index.html;

    # static files
    location /static/ {
        alias /app/static/;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # redirect to gunicorn
        location ~^/(api|admin) {
            proxy_pass http://gunicorn:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        # redirect to daphne
        location /ws {
            proxy_pass http://daphne:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 70s;
            proxy_send_timeout 70s;
            proxy_read_timeout 70s;
        }
    }
}
