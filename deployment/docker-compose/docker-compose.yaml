---

# This file is an example and should be adapted to your needs.
# You may be interested to use an `.env` file to keep secrets:
# https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/

services:
  # database server
  database:
    image: mariadb:latest
    volumes:
      - mysql_data:/var/lib/mysql:Z
    environment:
      MARIADB_ROOT_PASSWORD: "password"
      MARIADB_USER: "user"
      MARIADB_PASSWORD: "password"
      MARIADB_DATABASE: "dakara"
    restart: "unless-stopped"

  # cache server
  cache:
    image: redis:latest
    restart: "unless-stopped"

  # mail server
  # TODO

  # websocket server (and base configuration)
  websocket: &base
    image: dakaraproject/dakaraserver:latest
    volumes:
      - dakara_server_data:/data
    environment:
      DAKARA_DATABASE_URL: "mysql-connector://user:password@mysql:3306/dakara"
      # DAKARA_REDIS_URL: "redis://redis:6379"
      DAKARA_ALLOWED_HOSTS: "localhost,example.com"
      DAKARA_HOST_URL: "http://example.com"
      DAKARA_CSRF_TRUSTED_ORIGINS: "http://example.com"
      DAKARA_SECRET_KEY: "your-secret-key"
      # DAKARA_SUPERUSER_USERNAME: "admin"
      # DAKARA_SUPERUSER_EMAIL: "admin@localhost"
      DAKARA_SUPERUSER_PASSWORD: "admin-password"
      # DAKARA_LANGUAGE_CODE: "en-us"
      # DAKARA_TIME_ZONE: "UTC"
      # DAKARA_PLAYLIST_SIZE_LIMIT: 100
      DAKARA_EMAIL_ENABLED: true
      DAKARA_EMAIL_URL: "smtp://user:password@postfix:25"
      # DAKARA_EMAIL_SSL_KEYFILE: ""
      # DAKARA_EMAIL_SSL_CERTIFICATE: ""
      DAKARA_SENDER_EMAIL: "no-reply@example.com"
      DAKARA_LOG_TO_CONSOLE: false
      # DAKARA_LOG_LEVEL: "INFO"
      # DAKARA_LOG_FILE_PATH: "/data/logs/dakara_server.log"
      # DAKARA_LOG_FILE_MAX_SIZE: 1000000
      # DAKARA_LOG_FILE_BACKUP_COUNT: 2
      # DJANGO_LEG_LEVEL: "INFO"
    restart: "unless-stopped"
    depends_on:
      - database
      - cache
    healthcheck: &healthcheck
      test: ["CMD", "check_health_websocket_daphne.sh"]
      start_period: 30s
    command: "run_websocket_daphne.sh"

  # api server
  api:
    <<: *base
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "check_health_api_gunicorn.sh"]
    command: "run_api_gunicorn.sh"

  # scheduler for tasks
  scheduler:
    <<: *base
    healthcheck:
      disable: true
    command: "run_scheduler_apscheduler.sh"

  # web server (main entrygate)
  web:
    <<: *base
    depends_on:
      - websocket
      - api
      - scheduler
    ports:
      - 80:80
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "check_health_web_nginx.sh"]
    command: "run_web_nginx.sh"

volumes:
  dakara_server_data:
  mysql_data:
